<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="원신 천지만물 업적 전체 체크리스트. 국가별, 마신 임무, 적 관련, 공통으로 정리.">
<title>천지만물 체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: Genshin paimon-menu look. Beige page, navy square tiles per group, cream achievement cards inside. Single deliberate look, square corners. */
:root{
  color-scheme:light;
  --page:#eae0ce; --page-line:#cbbfa8; --tile:#343c4e; --tile-line:#444953; --tile-dark:#2a3141;
  --cream:#ece5d8; --cream-done:#d9d0bf; --card-line:#d2c6b0; --ink:#343c4e; --ink-soft:#6b6f78; --label:#b4b0a9;
  --gold:#d3bc8e; --gold-deep:#a8894f; --tip:#94692a;
  --world:#1d6c70; --daily:#566b1c; --region:#a24e1d; --rep:#5b4fa3;
  --mond:#74c2a8; --liyue:#f2b723; --inazuma:#b48dfb; --sumeru:#a5c83b; --fontaine:#4cc2f1; --natlan:#ef7938; --nodkrai:#9fd6e3;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{border-radius:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px}
header.top{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
header.top .legend{justify-content:center}
h1{font-weight:800;font-size:27px;margin:0;text-wrap:balance;color:var(--ink);letter-spacing:.02em;display:flex;align-items:center;gap:12px}
h1::before,h1::after{content:"";width:8px;height:8px;background:var(--gold-deep);transform:rotate(45deg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);border-block:1px solid var(--page-line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.total{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink);white-space:nowrap;min-width:calc(10ch + 2.4em)}
.meter{flex:1;min-width:120px;height:8px;background:#d6ccb9;border:1px solid var(--page-line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tile);width:0;transition:width .4s}
input[type=search]{flex:1;min-width:160px;font:inherit;padding:8px 12px;border:1px solid var(--page-line);background:#f4eee3;color:var(--ink)}
input[type=search]::placeholder{color:#8f8a80}
.chip{font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border:1px solid var(--tile-line);background:var(--tile);color:var(--cream);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold-deep)}
.chip:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.legend b{font-weight:700;background:var(--cream);padding:2px 9px;border:1px solid var(--card-line)}
.lw{color:var(--world)} .ld{color:var(--daily)} .lr{color:var(--region)} .lp{color:var(--rep)}
.sync{font-size:12px;color:#7d7a73;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:8em;text-align:right}
nav.jump{display:flex;gap:6px;flex-wrap:wrap}
nav.jump a{font-size:13px;font-weight:700;color:var(--cream);text-decoration:none;padding:7px 14px;background:var(--tile);position:relative}
nav.jump a::before{content:"";position:absolute;inset:2px;border:1px solid #444953;pointer-events:none}
nav.jump a:hover{color:var(--gold)}
nav.jump .cnt{margin-left:6px;color:var(--label);display:inline-block;min-width:3ch;text-align:right}
section.cat{margin-top:30px;scroll-margin-top:190px}
.cat-h{display:flex;align-items:center;gap:10px;padding:0 2px 8px;margin-bottom:4px;border-bottom:2px solid var(--tile)}
.cat-h h2{font-size:20px;font-weight:800;margin:0;color:var(--ink);letter-spacing:.03em;display:flex;align-items:center;gap:10px}
.cat-h h2::before{content:"";width:7px;height:7px;background:var(--gold-deep);transform:rotate(45deg)}
.cnt{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px;margin-left:auto}
details.grp{margin-top:8px;background:var(--tile);position:relative}
details.grp::before{content:"";position:absolute;inset:3px;border:2px solid #444953;pointer-events:none}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:hover{background:#3b4458}
details.grp>summary:hover .arrow{color:var(--cream)}
summary .nm{font-weight:800;font-size:16px;color:var(--cream);letter-spacing:.02em}
summary .nm[data-cty="몬드"]{color:var(--mond)} summary .nm[data-cty="리월"]{color:var(--liyue)} summary .nm[data-cty="이나즈마"]{color:var(--inazuma)}
summary .nm[data-cty="수메르"]{color:var(--sumeru)} summary .nm[data-cty="폰타인"]{color:var(--fontaine)} summary .nm[data-cty="나타"]{color:var(--natlan)} summary .nm[data-cty="노드크라이"]{color:var(--nodkrai)}
summary .arrow{color:var(--gold);transition:transform .2s;font-size:11px}
details[open]>summary .arrow{transform:rotate(90deg)}
summary .cnt{color:var(--label);min-width:9.5ch;text-align:right;white-space:nowrap;flex-shrink:0}
.mini{width:70px;height:5px;background:#555d6e;overflow:hidden;flex-shrink:0}
.mini i{display:block;height:100%;background:var(--gold)}
.grp-body{padding:0 10px 10px}
.kind{font-size:12px;font-weight:700;letter-spacing:.06em;margin:10px 4px 6px;color:var(--gold);display:flex;align-items:center;gap:8px}
.kind::after{content:"";flex:1;height:1px;background:var(--tile-line);order:1}
.ktog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.ktog:hover{color:var(--cream)}
.ktog:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.karr{font-size:9px;transition:transform .2s;transform:rotate(90deg)}
.kind.closed .karr{transform:none}
.kind.closed+ul{display:none}
.kind button.all{order:2;font:inherit;font-size:11px;font-weight:700;letter-spacing:0;padding:3px 9px;border:1px solid var(--tile-line);background:var(--tile-dark);color:var(--label);cursor:pointer}
.kind button.all:hover{color:var(--gold);border-color:var(--gold)}
.kind button.all:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.locked .kind button.all{opacity:.4;cursor:wait}
summary button.gall{margin-left:auto;font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border:1px solid #535a69;background:var(--tile-dark);color:var(--label);cursor:pointer;flex-shrink:0}
summary button.gall:hover{color:var(--gold);border-color:var(--gold)}
summary button.gall:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
summary button.gall+.cnt{margin-left:0}
.locked summary button.gall{opacity:.4;cursor:wait}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li.it{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:10px 14px;align-items:start;background:var(--cream);color:var(--ink);box-shadow:inset 0 0 0 1px var(--card-line)}
li.it input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border-radius:50%;border:2px solid #b7a98d;background:#e2d9c8;cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
li.it input::after{content:"";width:6px;height:11px;border:solid transparent;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
li.it input:checked{background:#c9a65c;border-color:#a8873f}
li.it input:checked::after{border-color:#fff}
li.it input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.body{min-width:0}
.name{font-weight:700;font-size:15px;color:var(--ink)}
.name a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(52,60,78,.3)}
.name a:hover{text-decoration-color:currentColor}
.name a::after{content:" \2197";font-size:11px;font-weight:400;color:var(--ink-soft)}
.w .name{color:var(--world)} .d .name{color:var(--daily)} .r .name{color:var(--region)} .p .name{color:var(--rep)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;margin-left:6px;vertical-align:1px;color:var(--ink);background:#d9ceb9}
.desc{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.tipbtn{font:inherit;font-size:11px;font-weight:700;color:var(--tip);background:transparent;border:1px solid #c9b78f;padding:0 6px;margin-left:6px;vertical-align:1px;cursor:pointer;line-height:1.5}
.tipbtn[aria-expanded="true"]{background:#e2d3b2}
.tipbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tipbody{margin:5px 0 0;font-size:13px;color:#5a5f6b;max-width:62ch}
li.it.done .tipbody{opacity:.6}
details.tip{margin-top:4px;font-size:13px;color:var(--ink-soft)}
details.tip summary{cursor:pointer;color:var(--tip);font-size:12px;font-weight:700;width:max-content}
details.tip p{margin:4px 0 0;max-width:62ch;color:#5a5f6b}
li.it.done{background:var(--cream-done);opacity:.75}
li.it.done .name a{text-decoration-line:line-through}
.hide-done li.it.done{display:none}
.hide-done .kind.alldone,.hide-done .kind.alldone+ul,.hide-done details.grp.alldone{display:none}
.locked li.it input{opacity:.4;cursor:wait}
footer{margin-top:36px;color:#7d7a73;font-size:12px;text-align:center;display:flex;flex-direction:column;gap:4px}
footer p{margin:0}
footer a{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tiers{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tiers button{font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border:1px solid #b7a98d;background:#e2d9c8;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.tiers button[aria-pressed="true"]{background:#c9a65c;border-color:#a8873f;color:#fff}
.tiers button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.locked .tiers button{opacity:.4;cursor:wait}
li.it input:indeterminate{background:#e9d9b3;border-color:#c9a65c}
li.it input:indeterminate::after{width:10px;height:0;border-width:0 0 3px 0;border-color:#a8873f;transform:none}

@media (max-width:600px){
  .wrap{padding-block:12px 48px}
  header.top{margin-bottom:10px;gap:8px}
  h1{font-size:21px;gap:10px}
  .bar{gap:6px;padding-block:7px}
  .total{font-size:14px}
  .sync{font-size:11px;width:6em}
  input[type=search]{padding:6px 10px;font-size:14px;min-width:0}
  .chip{padding:6px 12px;font-size:12px;flex-shrink:0}
  nav.jump{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
  nav.jump::-webkit-scrollbar{display:none}
  nav.jump a{padding:4px 10px;font-size:12px;white-space:nowrap;flex-shrink:0}
  section.cat{scroll-margin-top:120px;margin-top:22px}
  .cat-h h2{font-size:18px}
  details.grp{margin-top:6px}
  details.grp>summary{padding:9px 12px;gap:8px}
  summary .nm{font-size:15px}
  .mini{display:none}
  summary button.gall,.kind button.all{padding:2px 8px;font-size:11px}
  .grp-body{padding:0 6px 8px}
  .kind{margin:8px 4px 5px}
  ul.items{gap:4px}
  li.it{padding:8px 10px;gap:9px;grid-template-columns:20px 1fr}
  li.it input{width:20px;height:20px}
  li.it input::after{width:5px;height:10px}
  .name{font-size:14px;line-height:1.4}
  .desc{font-size:12.5px;line-height:1.4;margin-top:1px}
  .tiers{margin-top:5px}
  .tiers button{padding:2px 8px}
}
.side{display:contents}
@media (min-width:1000px){
  .wrap{max-width:1240px;display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-areas:"side main" "side foot";column-gap:28px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px;grid-area:side;position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow-y:auto;padding-block:4px 20px}
  main{grid-area:main;min-width:0}
  footer{grid-area:foot}
  header.top{align-items:flex-start;margin-bottom:0}
  header.top .legend{justify-content:flex-start}
  header.top .legend{gap:4px;flex-wrap:nowrap}
  header.top .legend b{padding:2px 6px;font-size:11px}
  h1{font-size:23px}
  h1::after{display:none}
  .bar{position:static;margin-inline:0;padding:0;border:none;background:transparent;gap:10px}
  .bar .row{flex-wrap:wrap}
  .meter{order:3;flex-basis:100%}
  input[type=search]{flex-basis:100%}
  .chip{width:100%}
  nav.jump{flex-direction:column;gap:6px;width:100%}
  nav.jump a{display:flex;justify-content:space-between;padding:9px 14px}
  section.cat{scroll-margin-top:12px}
  section.cat:first-child{margin-top:4px}
  details.grp{margin-top:6px}
  details.grp>summary{padding:10px 14px}
  .grp-body{padding:0 8px 8px}
  .kind{margin:6px 4px 5px}
  ul.items{gap:3px}
  li.it{padding:7px 12px;gap:10px;grid-template-columns:20px 1fr;align-items:center}
  li.it input{width:20px;height:20px;margin:0}
  li.it input::after{width:5px;height:10px}
  .body{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;row-gap:2px}
  .name{font-size:14.5px;line-height:1.45}
  .desc{font-size:13px;line-height:1.45;margin-top:0;flex:1 1 220px;min-width:0}
  .tiers,.tipbody{flex-basis:100%}
  .tiers{margin-top:3px}
}

</style>
</head>
<body>

<div class="wrap">
  <aside class="side">
  <header class="top">
    <h1>천지만물 체크리스트</h1>
    <div class="legend"><b class="lw">월드 임무</b><b class="ld">일일 의뢰</b><b class="lr">지역 업적</b><b class="lp">평판</b></div>
  </header>

  <div class="bar">
    <div class="row">
      <span class="total" id="total">0 / 0</span>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <span class="sync" id="sync">불러오는 중…</span>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="업적 이름이나 조건 검색" aria-label="검색">
      <button class="chip" id="hideDone" aria-pressed="false">완료 숨기기</button>
    </div>
    <div class="row"><nav class="jump" id="jump"></nav></div>
  </div>
  </aside>

  <main id="root"></main>
  <footer>
    <p>업적 설명과 팁 출처: <a href="https://namu.wiki/w/%EC%9B%90%EC%8B%A0/%EC%97%85%EC%A0%81/%EC%B2%9C%EC%A7%80%EB%A7%8C%EB%AC%BC" target="_blank" rel="noopener">나무위키 「원신/업적/천지만물」</a> (2026년 10월 기준), <a href="https://creativecommons.org/licenses/by-nc-sa/2.0/kr/" target="_blank" rel="noopener">CC BY-NC-SA 2.0 KR</a>. 이 페이지도 같은 조건으로 공유됩니다.</p>
    <p>원신과 관련 명칭은 HoYoverse의 자산입니다. 이 페이지는 비공식·비영리 팬 제작물입니다.</p>
    <p>업적 이름을 누르면 공략 검색이 새 탭으로 열립니다.</p>
  </footer>
</div>

function guideURL(name){

const TK=(id,t)=>100000+id*10+t;

function build(){
  const nav=document.getElementById("jump"); nav.innerHTML=""; root.innerHTML="";
  const ql=q.trim().toLowerCase();
  for(const c of CATS){
    const all=D.filter(x=>x[1]===c.k);

    sec.innerHTML=`<div class="cat-h"><h2>${c.t}</h2><span class="cnt" data-c="${c.k}"></span></div>`;
    nav.insertAdjacentHTML("beforeend",`<a href="#cat-${c.k}">${c.t}<span class="cnt" data-n="${c.k}"></span></a>`);
    for(const g of c.order){
      const gall=all.filter(x=>x[2]===g); if(!gall.length) continue;
      let items=ql?gall.filter(x=>(x[5]+" "+x[6]+" "+x[4]+" "+x[7]).toLowerCase().includes(ql)):gall;
      if(ql&&!items.length) continue;
      const key=c.k+"|"+g;
      const det=document.createElement("details");det.className="grp";det.dataset.g=key;
      det.open=ql?true:(openState[key]!==undefined?openState[key]:false);
      det.addEventListener("toggle",()=>{if(!q)openState[key]=det.open;});
      let inner="";
      if(c.kinds){
        for(const kk of c.kinds){const s=items.filter(x=>x[3]===kk);if(!s.length)continue;
          inner+=`<div class="kind l${kk}" data-kind><span class="ktog" role="button" tabindex="0" aria-expanded="true"><span class="karr" aria-hidden="true">▶</span>${KIND[kk]}</span><button type="button" class="all">모두 체크</button></div><ul class="items">${s.map(x=>itemHTML(x,true)).join("")}</ul>`;}
      }else if(c.bySub){
        const subs=[...new Set(items.map(x=>x[4]))];
        for(const sb of subs){const s=items.filter(x=>x[4]===sb);
          inner+=`<div class="kind lm" data-kind><span class="ktog" role="button" tabindex="0" aria-expanded="true"><span class="karr" aria-hidden="true">▶</span>${esc(sb)}</span><button type="button" class="all">모두 체크</button></div><ul class="items">${s.map(x=>itemHTML(x,false)).join("")}</ul>`;}
      }else inner=`<div class="kind lm" data-kind><span class="ktog" role="button" tabindex="0" aria-expanded="true"><span class="karr" aria-hidden="true">▶</span>전체</span><button type="button" class="all">모두 체크</button></div><ul class="items">${items.map(x=>itemHTML(x,true)).join("")}</ul>`;
      det.innerHTML=`<summary><span class="arrow">▶</span><span class="nm" data-cty="${esc(g)}">${esc(g)}</span><span class="mini" aria-hidden="true"><i></i></span><button type="button" class="gall">모두 체크</button><span class="cnt"></span></summary><div class="grp-body">${inner}</div>`;
      det.querySelectorAll("[data-kind]").forEach(k=>{const kk=key+"|"+k.querySelector(".ktog").textContent.slice(1);k.dataset.key=kk;
        if(!ql&&kindClosed[kk]){k.classList.add("closed");k.querySelector(".ktog").setAttribute("aria-expanded","false");}});
      sec.appendChild(det);
    }
    root.appendChild(sec);
  }
  root.classList.toggle("hide-done",hideDone);
  if(root.classList.contains("locked"))root.querySelectorAll("li.it input").forEach(cb=>cb.disabled=true);
  root.querySelectorAll("li.it").forEach(li=>{const x=BYID.get(+li.dataset.id);if(x&&x[8])paintItem(li);});
  refresh();
}

  const N=sum(D,units), n=sum(D,doneUnits);
  document.getElementById("total").textContent=`${n} / ${N} 완료`;
  document.getElementById("meter").style.width=(n/N*100)+"%";
  for(const c of CATS){
    const all=D.filter(x=>x[1]===c.k), tot=sum(all,units), dn=sum(all,doneUnits);
    document.querySelectorAll(`[data-c="${c.k}"]`).forEach(e=>e.textContent=`${dn} / ${tot}`);
    document.querySelectorAll(`[data-n="${c.k}"]`).forEach(e=>e.textContent=` ${tot-dn}`);
  }
  root.querySelectorAll("details.grp").forEach(det=>{
    const [ck,g]=det.dataset.g.split("|");
    const gall=D.filter(x=>x[1]===ck&&x[2]===g), gt=sum(gall,units), gd=sum(gall,doneUnits);
    det.querySelector("summary .cnt").textContent=`${gd} / ${gt}`;
    det.querySelector("summary .mini i").style.width=(gd/gt*100)+"%";
    det.classList.toggle("alldone",gd===gt); const gb=det.querySelector("button.gall"); if(gb)gb.textContent=gd===gt?"모두 해제":"모두 체크";
    det.querySelectorAll("[data-kind]").forEach(k=>{const ul=k.nextElementSibling;
      const all=[...ul.children].every(li=>li.classList.contains("done"));
      k.classList.toggle("alldone",all); const bt=k.querySelector("button.all"); if(bt)bt.textContent=all?"모두 해제":"모두 체크";});
  });
}
root.addEventListener("change",e=>{
  if(e.target.type!=="checkbox")return;
  const li=e.target.closest("li"), id=+li.dataset.id, x=BYID.get(id);
  if(x[8]){x[8].forEach((_,i)=>e.target.checked?done.add(TK(id,i+1)):done.delete(TK(id,i+1)));}
  else e.target.checked?done.add(id):done.delete(id);
  paintItem(li); saveLocal(); queueRemote(); refresh();
});
root.addEventListener("click",e=>{
  const tb=e.target.closest(".tipbtn"); if(tb){const p=tb.closest("li").querySelector(".tipbody"); p.hidden=!p.hidden; tb.setAttribute("aria-expanded",String(!p.hidden)); return;}
  const kt=e.target.closest(".ktog"); if(kt){toggleKind(kt);return;}
  const gb=e.target.closest("button.gall"), ab=gb||e.target.closest("button.all");
  if(gb)e.preventDefault();
  if(ab&&!root.classList.contains("locked")){
    const lis=gb?[...gb.closest("details.grp").querySelectorAll("li.it")]:[...ab.closest(".kind").nextElementSibling.children], on=!lis.every(li=>li.classList.contains("done"));
    lis.forEach(li=>{const x=BYID.get(+li.dataset.id); if(!x)return;
      if(x[8])x[8].forEach((_,i)=>on?done.add(TK(x[0],i+1)):done.delete(TK(x[0],i+1)));
      else on?done.add(x[0]):done.delete(x[0]); paintItem(li);});
    saveLocal(); queueRemote(); refresh(); return;
  }
  const b=e.target.closest(".tiers button"); if(!b||root.classList.contains("locked"))return;
  const li=b.closest("li"), id=+li.dataset.id, x=BYID.get(id), t=+b.dataset.t, on=done.has(TK(id,t));
  x[8].forEach((_,i)=>{const k=TK(id,i+1); if(!on&&i+1<=t)done.add(k); if(on&&i+1>=t)done.delete(k);});
  paintItem(li); saveLocal(); queueRemote(); refresh();
});
function toggleKind(kt){
  const k=kt.closest(".kind"), c=!k.classList.contains("closed");
  k.classList.toggle("closed",c); kt.setAttribute("aria-expanded",String(!c));
  if(!q&&k.dataset.key)kindClosed[k.dataset.key]=c;
}
root.addEventListener("keydown",e=>{const kt=e.target.closest&&e.target.closest(".ktog");
  if(kt&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggleKind(kt);}});
function paintItem(li){
  const x=BYID.get(+li.dataset.id); if(!x)return;
  const dn=isDone(x), part=!dn&&doneUnits(x)>0, cb=li.querySelector("input");
  li.classList.toggle("done",dn); if(cb){cb.checked=dn;cb.indeterminate=part;}
  li.querySelectorAll(".tiers button").forEach(b=>b.setAttribute("aria-pressed",done.has(TK(x[0],+b.dataset.t))));
}
const hb=document.getElementById("hideDone");
hb.setAttribute("aria-pressed",hideDone);
hb.addEventListener("click",()=>{hideDone=!hideDone;hb.setAttribute("aria-pressed",hideDone);try{localStorage.setItem(LS+"-hide",hideDone?"1":"0")}catch(e){}root.classList.toggle("hide-done",hideDone);});
let qt; document.getElementById("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value;build();},150);});
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify([...done]))}catch(e){}}

const sync=document.getElementById("sync");
let ref=null, timer=null, inflight=false, seen=false;
function applyDone(){
  root.querySelectorAll("li.it").forEach(paintItem);
  refresh();
}
function setLocked(v){root.classList.toggle("locked",v);root.querySelectorAll("li.it input").forEach(cb=>cb.disabled=v);}
function queueRemote(){
  if(!ref||!seen)return;
  sync.textContent="저장 중…"; clearTimeout(timer);
  timer=setTimeout(async()=>{
    timer=null; inflight=true;
    try{await ref.set({done:[...done].sort((a,b)=>a-b),updated:new Date().toISOString()});sync.textContent="저장됨";}
    catch(e){sync.textContent="기기에만 저장";}
    inflight=false;
  },700);
}
sync.textContent="브라우저 저장";
build();
</script>

</body>
</html>
